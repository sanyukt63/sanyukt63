<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <!-- Pixel grid bg -->
    <pattern id="pixel-grid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#050905"/>
      <rect width="15" height="15" fill="#070D07"/>
    </pattern>
    <!-- Scanline overlay -->
    <pattern id="scanlines" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="rgba(0,0,0,0.22)"/>
    </pattern>

    <!-- Glow filters -->
    <filter id="gglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#020702"/>
      <stop offset="65%"  stop-color="#050D05"/>
      <stop offset="100%" stop-color="#0A160A"/>
    </linearGradient>
    <linearGradient id="ground-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1A5C1A"/>
      <stop offset="35%"  stop-color="#0F3A0F"/>
      <stop offset="100%" stop-color="#071007"/>
    </linearGradient>
    <linearGradient id="stone-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#2A2A2A"/>
      <stop offset="100%" stop-color="#161616"/>
    </linearGradient>
    <linearGradient id="lava-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00FF41"/>
      <stop offset="40%"  stop-color="#00C132"/>
      <stop offset="75%"  stop-color="#00FF41"/>
      <stop offset="100%" stop-color="#007A1F"/>
    </linearGradient>
    <radialGradient id="core-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00FF41" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="900" height="280" fill="url(#sky-grad)"/>
  <rect width="900" height="280" fill="url(#pixel-grid)" opacity="0.6"/>

  <!-- Static stars -->
  <g fill="#AAFFBB" opacity="0.4">
    <rect x="18"  y="10" width="2" height="2"/><rect x="58"  y="28" width="2" height="2"/>
    <rect x="108" y="7"  width="2" height="2"/><rect x="175" y="20" width="2" height="2"/>
    <rect x="238" y="4"  width="2" height="2"/><rect x="308" y="17" width="2" height="2"/>
    <rect x="378" y="9"  width="2" height="2"/><rect x="448" y="26" width="2" height="2"/>
    <rect x="518" y="6"  width="2" height="2"/><rect x="588" y="14" width="2" height="2"/>
    <rect x="658" y="24" width="2" height="2"/><rect x="728" y="5"  width="2" height="2"/>
    <rect x="798" y="19" width="2" height="2"/><rect x="858" y="10" width="2" height="2"/>
    <rect x="86"  y="48" width="2" height="2"/><rect x="153" y="40" width="2" height="2"/>
    <rect x="338" y="36" width="2" height="2"/><rect x="478" y="42" width="2" height="2"/>
    <rect x="698" y="33" width="2" height="2"/><rect x="838" y="46" width="2" height="2"/>
  </g>

  <!-- Twinkling stars -->
  <rect x="43"  y="16" width="3" height="3" fill="#00FF41" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.05;0.6" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="348" y="12" width="3" height="3" fill="#00C132" opacity="0.5">
    <animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="668" y="8"  width="3" height="3" fill="#00FF41" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.05;0.4" dur="2.7s" repeatCount="indefinite"/>
  </rect>
  <rect x="818" y="30" width="3" height="3" fill="#00D633" opacity="0.5">
    <animate attributeName="opacity" values="0.9;0.15;0.9" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- ═══ SCROLLING LANDSCAPE — COPY A ═══ -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0,0" to="-900,0" dur="18s" repeatCount="indefinite"/>

    <!-- Ground + stone base -->
    <rect x="0"   y="240" width="900" height="40" fill="url(#stone-grad)"/>
    <rect x="0"   y="224" width="900" height="20" fill="url(#ground-grad)"/>

    <!-- Platform 1 -->
    <rect x="50"  y="208" width="48" height="16" fill="#1A5C1A"/>
    <rect x="50"  y="208" width="48" height="4"  fill="#22741F"/>
    <rect x="50"  y="224" width="48" height="16" fill="#2A2A2A"/>

    <!-- Glowing beacon column 1 -->
    <rect x="132" y="176" width="16" height="48" fill="#1E1E1E"/>
    <rect x="132" y="176" width="16" height="4"  fill="#00FF41" filter="url(#lglow)">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="130" y="172" width="20" height="8"  fill="#2A2A2A"/>

    <!-- Platform 2 -->
    <rect x="200" y="200" width="64" height="24" fill="#1A5C1A"/>
    <rect x="200" y="200" width="64" height="4"  fill="#22741F"/>
    <rect x="200" y="224" width="64" height="16" fill="#2A2A2A"/>

    <!-- Tall pixel tower -->
    <rect x="300" y="144" width="32" height="80" fill="#252525"/>
    <rect x="300" y="144" width="32" height="8"  fill="#333333"/>
    <rect x="304" y="136" width="24" height="12" fill="#3A3A3A"/>
    <!-- Tower torch (green glow) -->
    <rect x="330" y="168" width="6" height="8"   fill="#3A3A1A"/>
    <rect x="330" y="160" width="6" height="10"  fill="#00FF41" filter="url(#lglow)" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="0.85s" repeatCount="indefinite"/>
    </rect>
    <rect x="328" y="156" width="10" height="6" fill="#00C132" filter="url(#lglow)" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="0.85s" repeatCount="indefinite"/>
    </rect>

    <!-- Lava → now glowing green energy crack -->
    <rect x="370" y="260" width="80" height="10" fill="url(#lava-grad)" filter="url(#lglow)">
      <animate attributeName="opacity" values="1;0.55;1" dur="2s" repeatCount="indefinite"/>
    </rect>

    <!-- Cave entrance -->
    <rect x="430" y="232" width="48" height="8"  fill="#080808"/>
    <rect x="430" y="240" width="48" height="4"  fill="#111111"/>

    <!-- Staircase platform 3 -->
    <rect x="540" y="216" width="16" height="8"  fill="#1A5C1A"/>
    <rect x="556" y="208" width="16" height="16" fill="#1A5C1A"/>
    <rect x="572" y="200" width="64" height="24" fill="#1A5C1A"/>
    <rect x="572" y="200" width="64" height="4"  fill="#22741F"/>

    <!-- Beacon column 2 -->
    <rect x="660" y="160" width="16" height="64" fill="#1E1E1E"/>
    <rect x="660" y="160" width="16" height="4"  fill="#00FF41" filter="url(#lglow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </rect>

    <!-- Green energy crack 2 -->
    <rect x="760" y="256" width="60" height="14" fill="url(#lava-grad)" filter="url(#lglow)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Pixel pine trees -->
    <rect x="830" y="192" width="8"  height="32" fill="#0C2A0C"/>
    <rect x="822" y="184" width="24" height="16" fill="#0F3A0F"/>
    <rect x="826" y="176" width="16" height="12" fill="#0F3A0F"/>
    <rect x="830" y="170" width="8"  height="8"  fill="#123D12"/>

    <!-- Stone block texture lines -->
    <rect x="0" y="248" width="900" height="1" fill="#444444" opacity="0.2"/>
    <g fill="#333333" opacity="0.15">
      <rect x="0"   y="244" width="32" height="2"/><rect x="48"  y="244" width="32" height="2"/>
      <rect x="96"  y="244" width="32" height="2"/><rect x="144" y="244" width="32" height="2"/>
      <rect x="192" y="244" width="32" height="2"/><rect x="240" y="244" width="32" height="2"/>
      <rect x="288" y="244" width="32" height="2"/><rect x="336" y="244" width="32" height="2"/>
      <rect x="384" y="244" width="32" height="2"/><rect x="432" y="244" width="32" height="2"/>
      <rect x="480" y="244" width="32" height="2"/><rect x="528" y="244" width="32" height="2"/>
      <rect x="576" y="244" width="32" height="2"/><rect x="624" y="244" width="32" height="2"/>
      <rect x="672" y="244" width="32" height="2"/><rect x="720" y="244" width="32" height="2"/>
      <rect x="768" y="244" width="32" height="2"/><rect x="816" y="244" width="32" height="2"/>
      <rect x="864" y="244" width="32" height="2"/>
    </g>
  </g>

  <!-- ═══ SCROLLING LANDSCAPE — COPY B (offset +900 for seamless loop) ═══ -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="900,0" to="0,0" dur="18s" repeatCount="indefinite"/>
    <rect x="0"   y="240" width="900" height="40" fill="url(#stone-grad)"/>
    <rect x="0"   y="224" width="900" height="20" fill="url(#ground-grad)"/>
    <rect x="50"  y="208" width="48" height="16" fill="#1A5C1A"/>
    <rect x="50"  y="208" width="48" height="4"  fill="#22741F"/>
    <rect x="50"  y="224" width="48" height="16" fill="#2A2A2A"/>
    <rect x="132" y="176" width="16" height="48" fill="#1E1E1E"/>
    <rect x="132" y="176" width="16" height="4"  fill="#00FF41" filter="url(#lglow)">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="130" y="172" width="20" height="8"  fill="#2A2A2A"/>
    <rect x="200" y="200" width="64" height="24" fill="#1A5C1A"/>
    <rect x="200" y="200" width="64" height="4"  fill="#22741F"/>
    <rect x="200" y="224" width="64" height="16" fill="#2A2A2A"/>
    <rect x="300" y="144" width="32" height="80" fill="#252525"/>
    <rect x="300" y="144" width="32" height="8"  fill="#333333"/>
    <rect x="304" y="136" width="24" height="12" fill="#3A3A3A"/>
    <rect x="330" y="168" width="6"  height="8"  fill="#3A3A1A"/>
    <rect x="330" y="160" width="6"  height="10" fill="#00FF41" filter="url(#lglow)" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="0.85s" repeatCount="indefinite"/>
    </rect>
    <rect x="328" y="156" width="10" height="6"  fill="#00C132" filter="url(#lglow)" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="0.85s" repeatCount="indefinite"/>
    </rect>
    <rect x="370" y="260" width="80" height="10" fill="url(#lava-grad)" filter="url(#lglow)">
      <animate attributeName="opacity" values="1;0.55;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="430" y="232" width="48" height="8"  fill="#080808"/>
    <rect x="430" y="240" width="48" height="4"  fill="#111111"/>
    <rect x="540" y="216" width="16" height="8"  fill="#1A5C1A"/>
    <rect x="556" y="208" width="16" height="16" fill="#1A5C1A"/>
    <rect x="572" y="200" width="64" height="24" fill="#1A5C1A"/>
    <rect x="572" y="200" width="64" height="4"  fill="#22741F"/>
    <rect x="660" y="160" width="16" height="64" fill="#1E1E1E"/>
    <rect x="660" y="160" width="16" height="4"  fill="#00FF41" filter="url(#lglow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="760" y="256" width="60" height="14" fill="url(#lava-grad)" filter="url(#lglow)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="830" y="192" width="8"  height="32" fill="#0C2A0C"/>
    <rect x="822" y="184" width="24" height="16" fill="#0F3A0F"/>
    <rect x="826" y="176" width="16" height="12" fill="#0F3A0F"/>
    <rect x="830" y="170" width="8"  height="8"  fill="#123D12"/>
    <rect x="0" y="248" width="900" height="1" fill="#444444" opacity="0.2"/>
    <g fill="#333333" opacity="0.15">
      <rect x="0"   y="244" width="32" height="2"/><rect x="48"  y="244" width="32" height="2"/>
      <rect x="96"  y="244" width="32" height="2"/><rect x="144" y="244" width="32" height="2"/>
      <rect x="192" y="244" width="32" height="2"/><rect x="240" y="244" width="32" height="2"/>
      <rect x="288" y="244" width="32" height="2"/><rect x="336" y="244" width="32" height="2"/>
      <rect x="384" y="244" width="32" height="2"/><rect x="432" y="244" width="32" height="2"/>
      <rect x="480" y="244" width="32" height="2"/><rect x="528" y="244" width="32" height="2"/>
      <rect x="576" y="244" width="32" height="2"/><rect x="624" y="244" width="32" height="2"/>
      <rect x="672" y="244" width="32" height="2"/><rect x="720" y="244" width="32" height="2"/>
      <rect x="768" y="244" width="32" height="2"/><rect x="816" y="244" width="32" height="2"/>
      <rect x="864" y="244" width="32" height="2"/>
    </g>
  </g>

  <!-- Fade top of landscape into sky -->
  <rect width="900" height="145" fill="url(#sky-grad)" opacity="0.75"/>

  <!-- Scanlines -->
  <rect width="900" height="280" fill="url(#scanlines)" opacity="0.35"/>

  <!-- ═══ HUD FRAME BRACKETS ═══ -->
  <g stroke="#00FF41" stroke-width="2.5" fill="none" opacity="0.55">
    <polyline points="28,18 14,18 14,34"/>
    <polyline points="872,18 886,18 886,34"/>
    <polyline points="14,246 14,262 28,262"/>
    <polyline points="886,246 886,262 872,262"/>
  </g>

  <!-- Soft green halo behind title text -->
  <ellipse cx="450" cy="108" rx="310" ry="55" fill="url(#core-halo)" filter="url(#sglow)"/>

  <!-- SYSTEM ONLINE badge -->
  <g transform="translate(330,30)">
    <rect x="0" y="0" width="240" height="20" rx="2" fill="#020902" stroke="#00FF41" stroke-width="1" stroke-opacity="0.45"/>
    <text x="120" y="14" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#00FF41" letter-spacing="3">▶  SYSTEM ONLINE  //  READY</text>
  </g>

  <!-- MAIN NAME — shadow layer -->
  <text x="453" y="123" text-anchor="middle"
    font-family="'Courier New',monospace" font-size="40" font-weight="900"
    fill="#00FF41" letter-spacing="3" opacity="0.2">SANYUKT KUMAR RAI</text>
  <!-- MAIN NAME — glow layer -->
  <text x="450" y="120" text-anchor="middle"
    font-family="'Courier New',monospace" font-size="40" font-weight="900"
    fill="#00FF41" letter-spacing="3" filter="url(#gglow)" opacity="0.6">SANYUKT KUMAR RAI</text>
  <!-- MAIN NAME — crisp top layer -->
  <text x="450" y="120" text-anchor="middle"
    font-family="'Courier New',monospace" font-size="40" font-weight="900"
    fill="#EAFFF0" letter-spacing="3">SANYUKT KUMAR RAI</text>

  <!-- Green pulse underline -->
  <rect x="155" y="130" width="590" height="2.5" fill="#00FF41" rx="1" filter="url(#lglow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Role subtitle -->
  <text x="450" y="160" text-anchor="middle"
    font-family="'Courier New',monospace" font-size="13" font-weight="bold"
    fill="#00C132" letter-spacing="2">FULL STACK DEV  ◆  AI/ML ENTHUSIAST  ◆  GRAPHICS DESIGNER</text>

  <!-- Blinking cursor -->
  <rect x="771" y="145" width="9" height="16" fill="#00FF41">
    <animate attributeName="opacity" values="1;0;1" dur="1.0s" repeatCount="indefinite"/>
  </rect>

  <!-- Status bar footer -->
  <rect x="0" y="263" width="900" height="17" fill="#020702" opacity="0.9"/>
  <text x="18"  y="275" font-family="'Courier New',monospace" font-size="9" fill="#00FF41" opacity="0.65">[ GITHUB.COM/SANYUKT63 ]</text>
  <text x="450" y="275" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#00C132" opacity="0.55">DESIGN  ·  CODE  ·  INNOVATE</text>
  <text x="882" y="275" text-anchor="end"    font-family="'Courier New',monospace" font-size="9" fill="#00FF41" opacity="0.65">[ v2.0 ]</text>
</svg>
