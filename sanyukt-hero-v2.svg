<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;family=Space+Grotesk:wght@700;800&amp;display=swap');

      .bg-rect { fill: #050505; }
      
      .tag-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #FF4D00;
        letter-spacing: 0.1em;
      }

      .greeting-text {
        font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
        font-size: 22px;
        font-weight: 600;
        fill: #94A3B8;
      }

      .name-text {
        font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
        font-size: 44px;
        font-weight: 800;
        fill: #FFFFFF;
        letter-spacing: -0.02em;
      }

      .name-accent {
        fill: #FF4D00;
        filter: url(#orange-glow);
      }

      .role-text-1 {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14.5px;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: 0.08em;
      }

      .role-text-2 {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        font-weight: 700;
        fill: #FF8A00;
        letter-spacing: 0.06em;
      }

      .desc-text {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 14px;
        fill: #A0AEC0;
      }

      .hud-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        fill: #FF8A00;
        letter-spacing: 0.06em;
      }

      .grid-line {
        stroke: #FF4D00;
        stroke-opacity: 0.035;
        stroke-width: 1;
      }

      .synapse {
        stroke: #FF4D00;
        stroke-opacity: 0.25;
        stroke-width: 1.2;
      }
    </style>

    <!-- Filters for Neon Glow -->
    <filter id="orange-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-small" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-core" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b1" />
      <feGaussianBlur stdDeviation="24" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Radial Glow Background -->
    <radialGradient id="ai-glow-bg" cx="860" cy="190" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4D00" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#FF8A00" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="line-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D00" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FF8A00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF4D00" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect class="bg-rect" width="1200" height="380" rx="12" />
  <rect width="1200" height="380" fill="url(#ai-glow-bg)" rx="12" />

  <!-- Subtle Cyber Grid -->
  <g>
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />

    <line x1="150" y1="0" x2="150" y2="380" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="380" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="380" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="380" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="380" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="380" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="380" class="grid-line" />
  </g>

  <!-- ==================== LEFT SIDE TEXT CONTENT ==================== -->
  <g transform="translate(60, 0)">
    
    <!-- System Badge -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="220" height="26" rx="13" fill="#0C0704" stroke="#FF4D00" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="14" cy="13" r="3.5" fill="#FF4D00" filter="url(#glow-small)">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="17" class="tag-text">AI &amp; CREATIVE TECH</text>
    </g>

    <!-- Greeting Line -->
    <text x="0" y="110" class="greeting-text">Hi, I'm</text>

    <!-- Main Title -->
    <text x="0" y="155" class="name-text">Sanyukt <tspan class="name-accent">Kumar Rai</tspan></text>

    <!-- Role Subtitles -->
    <text x="0" y="195" class="role-text-1">FULL STACK DEVELOPER</text>
    <text x="0" y="218" class="role-text-2">• AI/ML ENTHUSIAST  • GRAPHICS DESIGNER</text>

    <!-- Accent Underline -->
    <rect x="0" y="234" width="320" height="2" fill="url(#line-accent)" rx="1">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite" />
    </rect>

    <!-- Supporting Line -->
    <text x="0" y="268" class="desc-text">Building intelligent, useful and visually engaging</text>
    <text x="0" y="290" class="desc-text">digital experiences.</text>
  </g>

  <!-- ==================== RIGHT SIDE ANIMATED AI NEURAL CORE ==================== -->
  <g transform="translate(860, 190)">
    
    <!-- Outer Orbit Ring 3 -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#FF4D00" stroke-opacity="0.18" stroke-width="1.2" stroke-dasharray="20 12">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite" />
    </circle>

    <!-- Middle Orbit Ring 2 -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="#FF8A00" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="10 10">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite" />
    </circle>

    <!-- Inner Orbit Ring 1 -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="#FF4D00" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="30 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
    </circle>

    <!-- Orbiting Satellite Dots -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite" />
      <circle cx="115" cy="0" r="4.5" fill="#FFFFFF" filter="url(#glow-small)" />
      <circle cx="-115" cy="0" r="4" fill="#FF8A00" filter="url(#glow-small)" />
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite" />
      <circle cx="0" cy="68" r="4" fill="#FF4D00" filter="url(#glow-small)" />
      <circle cx="0" cy="-68" r="3.5" fill="#FFFFFF" filter="url(#glow-small)" />
    </g>

    <!-- Synaptic Network Lines -->
    <g>
      <line x1="-140" y1="-80" x2="-80" y2="-110" class="synapse" />
      <line x1="-80" y1="-110" x2="20" y2="-130" class="synapse" />
      <line x1="20" y1="-130" x2="110" y2="-90" class="synapse" />
      <line x1="110" y1="-90" x2="140" y2="-20" class="synapse" />
      <line x1="140" y1="-20" x2="130" y2="70" class="synapse" />
      <line x1="130" y1="70" x2="60" y2="120" class="synapse" />
      <line x1="60" y1="120" x2="-40" y2="130" class="synapse" />
      <line x1="-40" y1="130" x2="-110" y2="80" class="synapse" />
      <line x1="-110" y1="80" x2="-140" y2="-80" class="synapse" />

      <!-- Center Spokes -->
      <line x1="-80" y1="-110" x2="0" y2="0" class="synapse" />
      <line x1="110" y1="-90" x2="0" y2="0" class="synapse" />
      <line x1="130" y1="70" x2="0" y2="0" class="synapse" />
      <line x1="-110" y1="80" x2="0" y2="0" class="synapse" />
    </g>

    <!-- Traveling Energy Pulses -->
    <g>
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" filter="url(#glow-small)">
        <animateMotion path="M-140,-80 L-80,-110 L0,0" dur="3.5s" repeatCount="indefinite" />
      </circle>

      <circle cx="0" cy="0" r="3.5" fill="#FF8A00" filter="url(#glow-small)">
        <animateMotion path="M130,70 L0,0" dur="2.8s" repeatCount="indefinite" />
      </circle>

      <circle cx="0" cy="0" r="3" fill="#FFFFFF" filter="url(#glow-small)">
        <animateMotion path="M-110,80 L0,0" dur="4s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Network Nodes -->
    <g>
      <circle cx="-140" cy="-80" r="4.5" fill="#FF4D00" filter="url(#glow-small)" />
      <circle cx="-80" cy="-110" r="5" fill="#FFFFFF" filter="url(#glow-small)" />
      <circle cx="20" cy="-130" r="4" fill="#FF4D00" filter="url(#glow-small)" />
      <circle cx="110" cy="-90" r="5" fill="#FFFFFF" filter="url(#glow-small)" />
      <circle cx="140" cy="-20" r="4" fill="#FF8A00" filter="url(#glow-small)" />
      <circle cx="130" cy="70" r="5" fill="#FFFFFF" filter="url(#glow-small)" />
      <circle cx="60" cy="120" r="4" fill="#FF4D00" filter="url(#glow-small)" />
      <circle cx="-40" cy="130" r="4.5" fill="#FF8A00" filter="url(#glow-small)" />
      <circle cx="-110" cy="80" r="5" fill="#FFFFFF" filter="url(#glow-small)" />
    </g>

    <!-- Central Glowing AI Core Orb -->
    <g>
      <circle cx="0" cy="0" r="38" fill="#FF4D00" fill-opacity="0.25" filter="url(#glow-core)">
        <animate attributeName="r" values="34;44;34" dur="3s" repeatCount="indefinite" />
        <animate attributeName="fill-opacity" values="0.18;0.38;0.18" dur="3s" repeatCount="indefinite" />
      </circle>

      <circle cx="0" cy="0" r="24" fill="#FF8A00" filter="url(#glow-small)">
        <animate attributeName="r" values="22;26;22" dur="3s" repeatCount="indefinite" />
      </circle>

      <circle cx="0" cy="0" r="10" fill="#FFFFFF" filter="url(#glow-small)" />
    </g>

    <!-- Floating HUD Labels -->
    <g transform="translate(-170, -135)">
      <rect x="0" y="0" width="65" height="20" rx="4" fill="#0C0704" stroke="#FF4D00" stroke-opacity="0.4" />
      <text x="10" y="14" class="hud-label">AI / ML</text>
    </g>

    <g transform="translate(110, -135)">
      <rect x="0" y="0" width="85" height="20" rx="4" fill="#0C0704" stroke="#FF4D00" stroke-opacity="0.4" />
      <text x="10" y="14" class="hud-label">FULL STACK</text>
    </g>

    <g transform="translate(130, 110)">
      <rect x="0" y="0" width="50" height="20" rx="4" fill="#0C0704" stroke="#FF8A00" stroke-opacity="0.4" />
      <text x="9" y="14" class="hud-label">DATA</text>
    </g>

    <g transform="translate(-170, 120)">
      <rect x="0" y="0" width="115" height="20" rx="4" fill="#0C0704" stroke="#FF4D00" stroke-opacity="0.4" />
      <text x="10" y="14" class="hud-label">SYSTEM ONLINE</text>
    </g>
  </g>

  <!-- Corner Tech Frame Brackets -->
  <g stroke="#FF4D00" stroke-width="1.5" stroke-opacity="0.5" fill="none">
    <path d="M 20 30 L 20 18 L 32 18" />
    <path d="M 1180 18 L 1180 30 L 1168 18" style="display:none" />
    <path d="M 1180 350 L 1180 362 L 1168 362" />
    <path d="M 20 362 L 20 350 L 32 362" />
  </g>

</svg>
